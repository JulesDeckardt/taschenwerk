name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "Taschenwerk-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Taschenwerk-${{ github.run_number }}
          path: Taschenwerk-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taschenwerk ${{ github.run_number }}
          files: Taschenwerk-${{ github.run_number }}.apk
          make_latest: true
