name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          cp build.log /tmp/build.log
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          git clean -fdxq
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Build-Log ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "Taschenwerk-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Taschenwerk-${{ github.run_number }}
          path: Taschenwerk-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taschenwerk ${{ github.run_number }}
          files: Taschenwerk-${{ github.run_number }}.apk
          make_latest: true
